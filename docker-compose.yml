# ──────────────────────────────────────────────────────────────────
# aprosop.ru — production stack
#
# Все значения берутся из файла .env рядом с этим файлом (см. .env.example).
# ВАЖНО: имена сервисов и volumes (pgdata, certbot-conf, certbot-www)
# менять нельзя — в них живут данные production.
#
# Переменные в виде "- NAME" (без значения) передаются в контейнер,
# только если заданы в .env; иначе действует значение по умолчанию из кода.
# ──────────────────────────────────────────────────────────────────
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-anonpsy}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
    command: >
      -n
      --realm=aprosop.ru
      --user=${TURN_USER:-aprosop}:${TURN_PASSWORD:-aprosopsecretturn}
      --lt-cred-mech
      --fingerprint
      --listening-port=3478
      --tls-listening-port=5349
      --cert=/etc/letsencrypt/live/aprosop.ru/fullchain.pem
      --pkey=/etc/letsencrypt/live/aprosop.ru/privkey.pem
      --min-port=49152
      --max-port=65535
      --log-file=stdout
      --verbose
      --no-loopback-peers
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    # Имя образа нужно сервису scheduler (он запускает тот же код)
    image: aprosop-api:latest
    restart: unless-stopped
    environment:
      # ── Django ──
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-change-in-production-please}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,aprosop.ru,www.aprosop.ru}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,https://aprosop.ru,https://www.aprosop.ru}
      - CSRF_TRUSTED_ORIGINS
      # ── Database / Redis (внутри docker-сети) ──
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-anonpsy}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-localdev}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # ── Auth / anonymity (optional: code defaults apply when unset) ──
      - JWT_SECRET_KEY
      - JWT_ACCESS_MINUTES
      - JWT_REFRESH_DAYS
      - EMAIL_HASH_SALT
      - ADMIN_LOGIN
      - ADMIN_PASSWORD
      - AUTH_THROTTLE_RATE
      - SCHEDULE_TIME_ZONE
      # ── Payments ──
      - YOOKASSA_SHOP_ID
      - YOOKASSA_SECRET_KEY
      - YOOKASSA_RETURN_URL
      - YOOKASSA_WEBHOOK_SECRET
      - PLATFORM_FEE_PERCENT
      # ── TURN (for backend-issued ICE config, if used) ──
      - TURN_USER=${TURN_USER:-aprosop}
      - TURN_PASSWORD=${TURN_PASSWORD:-aprosopsecretturn}
      # ── Chats & AI assistant «Тиша» (optional) ──
      - CHAT_ENCRYPTION_KEY
      # ── Версия (передаёт deploy.sh) ──
      - GIT_COMMIT
      - BUILD_TIME
      - CHAT_ALLOW_WITHOUT_BOOKING
      - CHAT_MAX_FILE_MB
      - CHAT_SEND_RATE
      - ANTHROPIC_API_KEY
      - AI_MODEL
      - AI_EFFORT
      - AI_DAILY_LIMIT
    volumes:
      # Uploaded files (specialist photos); nginx serves them read-only at /media/
      - media:/app/media
    # Migrations are committed to git — no makemigrations in production.
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate --noinput &&
             /app/.venv/bin/python manage.py collectstatic --noinput &&
             /app/.venv/bin/python manage.py create_admin &&
             exec /app/.venv/bin/daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    healthcheck:
      # Uses the first ALLOWED_HOSTS entry as Host header so Django never answers 400.
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |
          import os, sys, urllib.request
          h = os.environ.get("ALLOWED_HOSTS", "localhost").split(",")[0].strip().lstrip(".")
          h = "localhost" if h in ("", "*") else h
          r = urllib.request.Request("http://127.0.0.1:8000/api/v1/health/", headers={"Host": h})
          sys.exit(0 if urllib.request.urlopen(r, timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Удаляет сообщения чатов с истёкшим сроком хранения (режим «24 часа») каждые 5 минут.
  scheduler:
    image: aprosop-api:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-change-in-production-please}
      - DEBUG=${DEBUG:-False}
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-anonpsy}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-localdev}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "while :; do /app/.venv/bin/python manage.py purge_chats; sleep 300; done"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost}
        NEXT_PUBLIC_TURN_USER: ${NEXT_PUBLIC_TURN_USER:-${TURN_USER:-aprosop}}
        NEXT_PUBLIC_TURN_PASSWORD: ${NEXT_PUBLIC_TURN_PASSWORD:-${TURN_PASSWORD:-aprosopsecretturn}}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - media:/var/www/media:ro
    depends_on:
      - api
      - web
    # Reload nginx every 6h to pick up renewed certificates
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Check for renewal every 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  certbot-conf:
  certbot-www:
  media:
