# ──────────────────────────────────────────────────────────────────
# CI/CD для aprosop.ru
#   check        — сборка фронтенда и проверки Django (на каждый push)
#   deploy       — по SSH запускает deploy/deploy.sh на сервере
#                  (только если задан секрет DEPLOY_HOST)
#   healthcheck  — проверяет, что сайт отвечает после деплоя
# Инструкция по настройке: deploy/SETUP.md
# ──────────────────────────────────────────────────────────────────
name: Check & Deploy

on:
  push:
    branches:
      - claude/psychology-platform-design-n89Ow
      - main
    paths:
      - "apps/**"
      - "docker-compose.yml"
      - "nginx/**"
      - "coturn/**"
      - "deploy/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка для деплоя (пусто = переменная DEPLOY_BRANCH или текущая ветка)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ───────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Type-check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://example.invalid/api/v1
          NEXT_PUBLIC_WS_URL: wss://example.invalid
          NEXT_PUBLIC_TURN_USER: ci
          NEXT_PUBLIC_TURN_PASSWORD: ci
        run: npx next build

      # ── Backend ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Django checks & tests
        working-directory: apps/api
        env:
          SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdefghijklmnop
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          USE_POSTGRES: "False"   # sqlite
          REDIS_URL: ""           # in-memory channel layer
        run: |
          python manage.py check
          # Все изменения моделей должны иметь закоммиченные миграции
          # (на сервере makemigrations больше не выполняется).
          python manage.py makemigrations --check --dry-run
          if find apps config -name 'tests.py' -o -name 'test_*.py' -o -type d -name tests | grep -q .; then
            python manage.py test --noinput
          else
            echo "::notice title=No tests::В apps/api не найдено тестов — пропускаю manage.py test"
          fi

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Один деплой за раз; новый ждёт, пока закончится текущий (не отменяет его).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Decide whether to deploy
        id: gate
        env:
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          TARGET: ${{ inputs.branch || vars.DEPLOY_BRANCH || github.ref_name }}
        run: |
          if [ "$HAS_HOST" != "true" ]; then
            echo "::notice title=Deploy skipped::Секрет DEPLOY_HOST не задан в этом репозитории — деплой пропущен (см. deploy/SETUP.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TARGET" ]; then
            echo "::notice title=Deploy skipped::Push в '$GITHUB_REF_NAME', а деплоится ветка '$TARGET' (переменная DEPLOY_BRANCH)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "branch=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Деплою ветку: $TARGET"

      - name: Run deploy/deploy.sh on server
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APROSOP_BRANCH: ${{ steps.gate.outputs.branch }}
          APROSOP_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: APROSOP_BRANCH,APROSOP_PATH
          command_timeout: 35m
          script: |
            set -eu
            P="${APROSOP_PATH:-}"; [ -n "$P" ] || P="$HOME/psiho"
            cd "$P"
            # Берём deploy.sh из НОВОГО коммита: так изменения в самом скрипте
            # применяются сразу, в т.ч. при самом первом деплое.
            git fetch --depth 50 origin "+refs/heads/${APROSOP_BRANCH}:refs/remotes/origin/${APROSOP_BRANCH}"
            TMP="$(mktemp /tmp/aprosop-deploy.XXXXXX.sh)"
            git show "origin/${APROSOP_BRANCH}:deploy/deploy.sh" > "$TMP"
            status=0
            bash "$TMP" "$P" "$APROSOP_BRANCH" || status=$?
            rm -f "$TMP"
            exit $status

  healthcheck:
    name: Post-deploy health check
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://aprosop.ru' }}
    steps:
      - name: API health
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 15 "${SITE_URL%/}/api/v1/health/"
      - name: Home page
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 15 -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" "${SITE_URL%/}/"
